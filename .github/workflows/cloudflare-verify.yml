name: Cloudflare migration verification

on:
  pull_request:
  push:
    branches:
      - chore/cloudflare-migration
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build:vinext
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build-${{ github.run_id }}
          path: .cloudflare/output
          if-no-files-found: error
          retention-days: 7
